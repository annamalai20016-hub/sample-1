<style>

.btn:hover{filter:drop-shadow(0 0 10px var(--n));transform:translateY(-2px)}.btn.g{background:#1b1d24;color:var(--t)}.btn.r{background:var(--m);color:#000}.btn.s{padding:8px 14px;font-size:11px}

.body{animation:bc 10s linear infinite}@keyframes bc{0%,25%{fill:#5c4b3b}60%{fill:#2b2a2a}80%,100%{fill:#0b0e12}}

.spray{animation:sp 10s linear infinite;stroke:var(--c);stroke-width:2;stroke-dasharray:6 14}@keyframes sp{0%,50%{opacity:0}56%,68%{opacity:.9;stroke-dashoffset:-60}72%,100%{opacity:0}}

.card:hover{box-shadow:0 0 0 1px var(--n)}.card.on{outline:2px solid var(--n);outline-offset:-2px;background:linear-gradient(#142200,#0d0e12) padding-box,linear-gradient(135deg,var(--n),var(--c)) border-box}
.card h3{font-size:15px;margin-bottom:6px;position:relative}.card p{color:var(--d);font-size:13px;margin:0 0 10px;position:relative}.pr{font:800 20px Unbounded;color:var(--n);position:relative}
.fx{position:absolute;inset:0;pointer-events:none}.fx i{position:absolute;bottom:-14px;width:12px;height:12px;border-radius:50%;border:1px solid var(--c);opacity:0}
.card:hover .fx i,.card.on .fx i{animation:rise 2.4s infinite}
@keyframes rise{20%{opacity:.9}100%{transform:translateY(-190px) scale(1.5);opacity:0}}
.fx.w i{width:3px;height:14px;border-radius:2px;border:0;background:var(--c);top:-16px;bottom:auto}.card:hover .fx.w i,.card.on .fx.w i{animation:drop 1s linear infinite}@keyframes drop{from{transform:translateY(0);opacity:1}to{transform:translateY(190px);opacity:0}}
.fx.i i{border:0;background:radial-gradient(var(--n),transparent 70%);width:16px;height:16px;top:20%;bottom:auto}.card:hover .fx.i i,.card.on .fx.i i{animation:tw 1.6s infinite}@keyframes tw{50%{transform:scale(2);opacity:1}}
.dock{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;gap:4px;padding:8px;background:#0d0e12ee;backdrop-filter:blur(12px);border:1px solid #2a2f3a;border-radius:999px 18px 999px 18px;z-index:5;max-width:96vw;overflow-x:auto}
.dock button{background:0;border:0;padding:10px 14px;border-radius:999px;cursor:pointer;color:var(--d);font:600 11px Unbounded;white-space:nowrap;transition:.25s}
.dock button.on{background:var(--n);color:#000;box-shadow:0 0 18px #c6ff0066}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:22px;flex-wrap:wrap}
.chip{font:600 10px Unbounded;padding:5px 10px;border-radius:99px;border:1px solid}.chip.p{color:var(--m);border-color:var(--m)}.chip.d{color:var(--n);border-color:var(--n)}
.stat{padding:18px}.stat b{display:block;font:800 26px Unbounded;color:var(--n)}.stat span{color:var(--d);font-size:12px}
.bars{display:flex;align-items:flex-end;gap:10px;height:140px;padding:10px 4px}.bars div{flex:1;background:linear-gradient(var(--n),var(--c));min-height:3px;animation:gr .8s both;transform-origin:bottom;position:relative}
@keyframes gr{from{transform:scaleY(0)}}.bars small{position:absolute;bottom:-20px;left:0;right:0;text-align:center;color:var(--d);font-size:10px}
.row{display:flex;gap:12px;align-items:center;padding:14px 16px;margin-bottom:10px;flex-wrap:wrap;animation:up .4s both}.row>.g1{flex:1;min-width:160px}
.steps{display:flex;gap:6px;margin-bottom:20px}.steps i{flex:1;height:4px;background:#222;transition:.4s}.steps i.on{background:var(--n);box-shadow:0 0 10px var(--n)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tab{display:flex;gap:8px;margin:10px 0}.pill{cursor:pointer;padding:8px 14px;border:1px solid #2a2f3a;border-radius:99px;font-size:12px;background:0}.pill.on{border-color:var(--n);color:var(--n)}
#modal{position:fixed;inset:0;background:#000d;z-index:20;display:none;overflow:auto;padding:20px}#modal.o{display:block}
.inv{background:#fff;color:#111;max-width:680px;margin:0 auto;padding:30px;font:13px/1.5 system-ui,sans-serif}.inv h2{font-family:inherit;font-size:20px}.inv table{width:100%;border-collapse:collapse;margin:14px 0}.inv th,.inv td{padding:7px;border-bottom:1px solid #ddd;text-align:left}.inv .r{text-align:right}.inv hr{border:0;border-top:2px dashed #999}
@media(max-width:800px){#root.gate{grid-template-columns:1fr}#scene{position:relative;height:42vh}#ui{min-height:0}.two{grid-template-columns:1fr}}
@media print{body{background:#fff}#root,.btnbar{display:none!important}#modal{position:static;background:#fff;padding:0;display:block}}
#c3d{position:absolute;inset:0;width:100%;height:100%}#stg{position:absolute;bottom:9%;margin:0;z-index:2}.ph{height:92px;display:flex;align-items:center;justify-content:center;text-align:center;cursor:pointer;font-size:11px;color:var(--d);overflow:hidden;position:relative;padding:4px}.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.ph b{position:absolute;bottom:2px;left:4px;font-size:10px;color:var(--n);text-shadow:0 0 4px #000;z-index:1}.ph input{display:none}.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;max-width:900px;margin:0 auto}.gal img{width:100%;border:1px solid #333}
#root.reg{display:block}#root.reg #scene{display:none}#root.reg #ui{max-width:760px;margin:0 auto;justify-content:flex-start;padding-bottom:60px}.sec{padding:20px;margin-bottom:14px}.sec h3{font-size:13px;margin-bottom:12px;color:var(--c)}.pf{display:flex;flex-direction:column}.pf label{font-size:10px}.pf input{width:92px;margin:0}
html{-webkit-text-size-adjust:100%}body{overflow-x:hidden}*{-webkit-tap-highlight-color:transparent}input,select{font-size:16px;min-height:44px}.btn{min-height:44px}
@media(max-width:600px){.btn{padding:14px 16px}.dock button{padding:12px 10px;font-size:10px}.grid{grid-template-columns:repeat(auto-fill,minmax(145px,1fr))}.row{padding:12px}.pf input{width:80px}#ui{padding:16px}#scene{height:36vh}}
.hero{position:relative;width:min(560px,92%);aspect-ratio:560/339}.tilt{position:absolute;inset:0;transform-style:preserve-3d;animation:tl 8s ease-in-out infinite}
@keyframes tl{0%,100%{transform:rotateY(-14deg) rotateX(4deg) translateY(0)}50%{transform:rotateY(14deg) rotateX(2deg) translateY(-8px)}}
.carimg,.mud{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.carimg{animation:dull 10s ease-in-out infinite}@keyframes dull{0%,18%{filter:saturate(.4) brightness(.65)}60%,88%{filter:saturate(1.15) brightness(1.05) drop-shadow(0 0 20px #ff2b4a77)}100%{filter:saturate(.4) brightness(.65)}}
.mud{animation:md 10s ease-in-out infinite}@keyframes md{0%,18%{opacity:.95}60%,88%{opacity:0}100%{opacity:.95}}
.shw{position:absolute;inset:0;overflow:hidden;-webkit-mask:var(--carurl) center/contain no-repeat;mask:var(--carurl) center/contain no-repeat}
.sh{position:absolute;top:-10%;bottom:-10%;width:70px;background:linear-gradient(100deg,#fff0,#fffc,#fff0);transform:skewX(-20deg) translateX(-140px);animation:shn 10s linear infinite}@keyframes shn{0%,62%{transform:skewX(-20deg) translateX(-140px)}84%,100%{transform:skewX(-20deg) translateX(640px)}}
#bub{position:absolute;inset:0;pointer-events:none}#bub i{position:absolute;border-radius:50%;border:1px solid #00f0ffaa;background:radial-gradient(circle at 30% 30%,#fff,#ffffff22 60%);opacity:0;animation:bu 3.4s ease-in infinite}@keyframes bu{0%{transform:translateY(0) scale(.3);opacity:0}15%{opacity:.85}100%{transform:translateY(-150px) scale(1.2);opacity:0}}
.hero .floor{position:absolute;bottom:-8%;left:12%;width:76%;height:80px;background:radial-gradient(ellipse,#c6ff0066,transparent 65%);transform:rotateX(70deg)}
.ic{width:56px;height:56px;display:block;margin-bottom:10px;color:var(--n);fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}.ic .c{stroke:var(--c)}.vimg{width:100%;height:80px;object-fit:contain;display:block;margin-bottom:8px}.tr{display:flex;justify-content:space-between;color:var(--d)}
.hero{position:relative;width:min(560px,92%);aspect-ratio:420/215}.car2d{width:100%;height:100%;overflow:visible;animation:bob 3s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-3px)}}
.cg2{animation:dl2 10s ease-in-out infinite}@keyframes dl2{0%,18%{filter:saturate(.35) brightness(.7)}60%,90%{filter:saturate(1.1) brightness(1.06) drop-shadow(0 0 14px #ff2b4a66)}100%{filter:saturate(.35) brightness(.7)}}
.dm2{animation:dt2 10s ease-in-out infinite}@keyframes dt2{0%,18%{opacity:1}58%{opacity:.05}66%,92%{opacity:0}100%{opacity:1}}
.fm2{animation:fo2 10s ease-in-out infinite}@keyframes fo2{0%,14%{opacity:0}28%,46%{opacity:1}62%,100%{opacity:0}}
.fb2{fill:#fff3ef;stroke:#ffcfc8;stroke-width:1.2;animation:fp2 2.2s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}@keyframes fp2{to{transform:scale(1.18)}}
.sy2{stroke:#00f0ff;stroke-width:2.5;stroke-dasharray:7 12;animation:sya 10s linear infinite}@keyframes sya{0%,46%{opacity:0}52%,64%{opacity:.9}70%,100%{opacity:0}}.sy2 line{animation:fl2 .6s linear infinite}@keyframes fl2{to{stroke-dashoffset:-38}}
.sh2{transform-box:fill-box;animation:sw2 10s linear infinite}@keyframes sw2{0%,62%{transform:translateX(0) skewX(-20deg)}86%,100%{transform:translateX(520px) skewX(-20deg)}}
.sk2{animation:ska 10s linear infinite}@keyframes ska{0%,66%{opacity:0}72%,90%{opacity:1}96%,100%{opacity:0}}.st2{animation:tw2 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes tw2{50%{transform:scale(1.7) rotate(45deg)}}
#scene .sp2{animation:spn 1s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes spn{to{transform:rotate(360deg)}}
</style></head><body>
<div id="root" class="gate">
<div id="scene"><div class="hero" id="hero"></div><div id="stg">DIRTY</div></div>
<div id="ui"></div></div><div id="modal"></div>
<script>
const $=s=>document.querySelector(s),K='woshly_v1',M=n=>'₹'+Number(n).toLocaleString('en-IN',{maximumFractionDigits:2}),r2=n=>Math.round(n*100)/100;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,8),dk=t=>new Date(t).toLocaleDateString('en-CA');
let DB=null;try{DB=JSON.parse(localStorage.getItem(K))}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(DB))}catch(e){}};
const defSv=()=>[{id:'s1',t:'car',n:'Foam Wash',d:'Snow-foam pre-soak, hand finish',p:{hatchback:399,sedan:499,suv:649},fx:''},{id:'s2',t:'car',n:'Normal Wash',d:'Pressure rinse, shampoo, dry',p:{hatchback:299,sedan:349,suv:449},fx:'w'},{id:'s3',t:'car',n:'Interior Cleaning',d:'Vacuum, dash, seats, mats',p:{hatchback:599,sedan:749,suv:949},fx:'i'},{id:'s4',t:'bike',n:'Foam Wash',d:'Foam soak + detail rinse',p:{std:199},fx:''},{id:'s5',t:'bike',n:'Normal Wash',d:'Rinse, shampoo, dry',p:{std:129},fx:'w'}];
const defCustom=()=>[{id:'c1',t:'car',n:'PPF (Paint Protection Film)',d:'Rate quoted per vehicle',custom:true,g:0,p:{}},{id:'c2',t:'bike',n:'PPF (Paint Protection Film)',d:'Rate quoted per vehicle',custom:true,g:0,p:{}}];
const defAd=()=>[{id:'a1',t:'car',n:'Tyre Polish',p:99},{id:'a2',t:'car',n:'AC Vent Cleaning',p:249},{id:'a3',t:'car',n:'Engine Bay Cleaning',p:399},{id:'a4',t:'car',n:'Wax Polish',p:349},{id:'a5',t:'bike',n:'Chain Clean & Lube',p:79},{id:'a6',t:'bike',n:'Tyre Polish',p:49}];
function seed(){const o={id:'demo',name:'Woshly Demo Studio',gst:'33ABCDE1234F1Z5',addr:'12 Marina Road',city:'Chennai',phone:'9876543210',email:'hello@woshly.in',wa:'9876543210',waOn:true,seq:0,users:[{u:'admin',p:'admin123',role:'admin'},{u:'staff',p:'staff123',role:'employee'}],sv:[...defSv(),...defCustom()],ad:defAd(),orders:[]};
for(let i=0;i<16;i++){const sv=o.sv[i%3],sz=['hatchback','sedan','suv'][i%3],ts=Date.now()-Math.floor(i/2)*864e5-i*36e5;o.orders.push(mk(o,{t:'car',size:sz,sv,ad:[o.ad[i%3]],c:{name:['Arjun','Meera','Karthik','Divya','Ravi'][i%5],phone:'98xxxxxx'+i,vname:['Swift','City','Creta','i20','Nexon'][i%5],vno:'TN 09 AB '+(1000+i*37)},pay:['cash','card','gpay'][i%3]},ts,i>2?'delivered':'pending'))}return o}
function calc(o,w){const k=w.t==='bike'?'std':w.size,items=[{n:w.sv.n+(w.t==='car'?' ('+w.size+')':' (bike)'),p:w.sv.custom?(+w.cr||0):w.sv.p[k]},...w.ad.map(a=>({n:a.n,p:a.p}))],sub=r2(items.reduce((a,b)=>a+b.p,0)),dv=Math.min(100,Math.max(0,+w.dv||0)),disc=r2(sub*dv/100),tx=r2(sub-disc),cg=r2(tx*.09);return{items,sub,disc,dp:dv,tx,cg,sg:cg,total:r2(tx+cg*2)}}
function totH(o,w){const c=calc(o,w);return c.items.map(i=>`<div style="display:flex;justify-content:space-between"><span>${esc(i.n)}</span><b>${M(i.p)}</b></div>`).join('')+`<hr style="border-color:#222"><div class="tr"><span>Subtotal</span><span>${M(c.sub)}</span></div>${c.disc?`<div class="tr" style="color:var(--m)"><span>Discount (${c.dp}%)</span><span>− ${M(c.disc)}</span></div><div class="tr"><span>Taxable value</span><span>${M(c.tx)}</span></div>`:''}<div class="tr"><span>CGST 9%</span><span>${M(c.cg)}</span></div><div class="tr"><span>SGST 9%</span><span>${M(c.sg)}</span></div><div class="pr" style="display:flex;justify-content:space-between;margin-top:8px"><span>TOTAL</span><span>${M(c.total)}</span></div>`}
function mk(o,w,ts,st){const c=calc(o,w);return{id:uid(),no:'INV-'+new Date(ts).getFullYear()+'-'+String(++o.seq).padStart(4,'0'),ts,t:w.t,c:w.c,...c,pay:w.pay,status:st||'pending'}}
if(!DB||!DB.orgs){DB={orgs:[seed()]};save()}
DB.orgs.forEach(o=>{if(!o.sv.some(x=>x.custom))o.sv.push(...defCustom())});save();
let S={view:'pick',org:null,user:null,tab:'new',w:{step:1,ad:[],c:{}},flt:'all',day:dk(Date.now())};
const O=()=>DB.orgs.find(o=>o.id===S.org),adm=()=>S.user&&S.user.role==='admin';
function R(){const was=$('#root').className,nc=S.user?'in':S.view==='reg'?'reg':'gate';$('#root').className=nc;$('#ui').innerHTML=S.user?shell():gate();if(nc==='gate'&&was!=='gate')sync()}
function gate(){const logo='<div class="logo">◉ WOSHLY</div>';
if(S.view==='pick')return`${logo}<h1>Your wash studio.<br><em>One neon dashboard.</em></h1><p class="sub">Choose your organisation to sign in, or register a new studio with GST-ready billing.</p><div class="grid">${DB.orgs.map((o,i)=>`<div class="card chm" style="animation-delay:${i*.08}s" onclick="S.org='${o.id}';S.view='login';R()"><h3>${esc(o.name)}</h3><p>${esc(o.city)} · GST ${esc(o.gst)}</p><span class="chip d">SIGN IN →</span></div>`).join('')}<div class="card chm" onclick="S.view='reg';R()"><h3 style="color:var(--n)">+ Register studio</h3><p>New organisation with admin &amp; staff logins</p></div></div>`;
if(S.view==='login'){const o=O();return`${logo}<h1>${esc(o.name)}</h1><p class="sub">${esc(o.addr)}, ${esc(o.city)}</p><div class="chm" style="padding:22px;max-width:380px"><label>Username</label><input id="lu" autocomplete="username"><label>Password</label><input id="lp" type="password" autocomplete="current-password" onkeydown="event.key==='Enter'&&login()"><p id="le" style="color:var(--m);margin:0 0 8px"></p><button class="btn" onclick="login()">ENTER STUDIO</button> <button class="btn g" onclick="S.view='pick';R()">BACK</button>${o.id==='demo'?'<p class="sub" style="margin:14px 0 0;font-size:12px">Demo → admin / admin123 · staff / staff123</p>':''}</div>`}

icle</label><select id="n_t"><option>car</option><option>bike</option></select></div><div><label>Name</label><input id="n_n"></div><div><label>Description</label><input id="n_d"></div></div><div class="three"><div><label>Hatchback ₹ (or bike / add-on price / custom guide)</label><input id="n_1" type="number"></div><div><label>Sedan ₹</label><input id="n_2" type="number"></div><div><label>SUV ₹</label><input id="n_3" type="number"></div></div><button class="btn" onclick="addS()">ADD</button></div>`}

const bu=(()=>{const m=new WeakMap();return b=>{if(!m.has(b))m.set(b,URL.createObjectURL(b));return m.get(b)}})();
const idb=()=>new Promise((ok,no)=>{const r=indexedDB.open('woshly_photos',1);r.onupgradeneeded=()=>r.result.createObjectStore('p');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
async function pput(id,v){try{const d=await idb();await new Promise((ok,no)=>{const t=d.transaction('p','readwrite');t.objectStore('p').put(v,id);t.oncomplete=ok;t.onerror=()=>no(t.error)})}catch(e){console.warn('photo store failed',e)}}
async function pget(id){try{const d=await idb();return await new Promise((ok,no)=>{const q=d.transaction('p').objectStore('p').get(id);q.onsuccess=()=>ok(q.result||[]);q.onerror=()=>no(q.error)})}catch(e){return[]}}
async function toBlob(c,q){const t=c.toDataURL('image/webp').startsWith('data:image/webp')?'image/webp':'image/jpeg';let o;do{o=await new Promise(r=>c.toBlob(r,t,q));q-=.1}while(o.size>90e3&&q>.2);return o}
async function comp(f){const b=await createImageBitmap(f),k=Math.min(1,1024/Math.max(b.width,b.height)),c=document.createElement('canvas');c.width=Math.round(b.width*k);c.height=Math.round(b.height*k);c.getContext('2d').drawImage(b,0,0,c.width,c.height);return toBlob(c,.7)}
